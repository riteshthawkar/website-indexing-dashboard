# ─────────────────────────────────────────────────────────────
# MBZUAI Main Website — Gemini retrieval + semantic GraphRAG
# Adds deterministic graph, semantic entity/relation extraction,
# graph promotion, and optional Neo4j sync alongside vector indexing.
# ─────────────────────────────────────────────────────────────
_inherit: mbzuai_main_gemini_retrieval.yaml

stages:
  - id: crawl_web
    type: crawler
    plugin: crawl4ai
  - id: score_raw_content
    type: quality_gate
    plugin: quality_scorer
  - id: clean_html
    type: cleaner
    plugin: trafilatura
  - id: convert_documents
    type: converter
    plugin: docling
  - id: convert_html
    type: converter
    plugin: markitdown
  - id: deduplicate_markdown
    type: quality_gate
    plugin: dedup_filter
  - id: chunk_content
    type: chunker
    plugin: hybrid
  - id: format_retrieval
    type: formatter
    plugin: gemini_retrieval
  - id: format_graph
    type: formatter
    plugin: knowledge_graph
  - id: gliner_extract_graph
    type: formatter
    plugin: gliner_extract
  - id: extract_semantic_graph
    type: formatter
    plugin: semantic_graph_extract
  - id: canonicalize_semantic_graph
    type: formatter
    plugin: semantic_graph_canonicalize
  - id: promote_graph
    type: formatter
    plugin: semantic_graph_promote
  - id: community_graph
    type: formatter
    plugin: semantic_graph_community
  - id: summarize_community_graph
    type: formatter
    plugin: semantic_graph_summarize
  - id: finalize_retrieval_bundle
    type: formatter
    plugin: gemini_retrieval
  - id: upload_retrieval
    type: embedder
    plugin: gemini_pinecone
  - id: upload_graph
    type: embedder
    plugin: neo4j_graph_store

retrieval:
  retriever_backend: "graph_hybrid"

graph:
  extraction_source: "facts_only"
  extraction_batch_size: 16
  extraction_parallelism: 3
  extraction_max_items: 800
  extraction_max_items_per_document: 3
  extraction_min_score: 5.0
  extraction_priority_host_suffixes: ["mbzuai.ac.ae"]
  extraction_include_chunk_fallback: false
  neo4j_clear_all_kg_nodes_on_zero_progress: true
