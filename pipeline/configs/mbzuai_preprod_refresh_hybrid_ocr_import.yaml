# Immutable exact-OCR overlay for the September 2026 preproduction snapshot.
# The GPU batch is content-hash pinned and quality-adjudicated before this
# formatter is allowed to add exact text to the captioned media contract.

project_name: "mbzuai_preprod_refresh_hybrid_ocr"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

formatter:
  media_ocr:
    provider: "batch_manifest"
    model: "PP-OCRv5 + baidu/Unlimited-OCR"
    model_revision: "paddleocr-3.7.0/paddle-3.2.0 + 07dea832e22aefee32ad281d4b80551282e1c168"
    provider_revision: "paddleocr-3.7.0 + transformers-direct"
    quality_revision: "hybrid-exact-ocr-quality-v1"
    batch_contract_sha256: "476c93cd5798ade0e15af3a1dc3aa9c07dec4c36685ff6ea430c885ff85a182b"
    batch_results:
      path: "runs/ocr_batches/mbzuai-preprod-refresh-hybrid-ocr-20260909-v1/results/adjudicated.json"
      sha256: "27f851c1de59013a69dfe2381d9e1c0a46cf428a30720c8622098a13a8b1f107"
    allow_unused_batch_results: false
    input_artifacts:
      page_media_file:
        path: "runs/mbzuai_preprod_refresh_pdf_media_completion/mbzuai-preprod-refresh-pdf-media-20260909-v1/stage_outputs/annotate_recovered_media/semantically_annotated_page_media.json"
        sha256: "c8a04d56ac1f524aafe9c0f71ce16d71424d77d6e7e01251ec88234b41fe98a2"
      page_images_file:
        path: "runs/mbzuai_preprod_refresh_pdf_media_completion/mbzuai-preprod-refresh-pdf-media-20260909-v1/stage_outputs/annotate_recovered_media/semantically_annotated_page_images.json"
        sha256: "1fcc4ee5d6060f6a89fe1042c2d9947698e3052f6a73fc8e0c3e95f7bb577d07"
      extracted_images_index_file:
        path: "runs/mbzuai_preprod_refresh_pdf_media_completion/mbzuai-preprod-refresh-pdf-media-20260909-v1/stage_outputs/annotate_recovered_media/semantically_annotated_document_media.json"
        sha256: "05eb2b46e88b2e43ae076cd683cc8547f787f505cc3546d1394e06fa66fdef70"
      media_manifest_file:
        path: "runs/mbzuai_preprod_refresh_pdf_media_completion/mbzuai-preprod-refresh-pdf-media-20260909-v1/stage_outputs/annotate_recovered_media/semantically_annotated_media_manifest.json"
        sha256: "e0815fed2bef4b10e6fd0487243a9cfcfce2ae5cff72247f49bd00ba71a73f98"
    scope: "all"
    needs_ocr_only: true
    concurrency: 1
    retry_attempts: 1
    request_timeout_sec: 1
    primary_mode: "gundam"
    retry_mode: "base"
    max_images: 0
    minimum_usable_text_ratio: 0.55
    maximum_rejected_ratio: 0.25
    require_complete: true

stages:
  - id: enrich_exact_ocr
    type: formatter
    plugin: media_ocr
