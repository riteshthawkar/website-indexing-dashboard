# Interim production profile for deploying the redesigned MBZUAI corpus through
# the existing Pinecone-backed retrieval infrastructure. The evaluated c650 /
# Gemini-1536 / dense-graph representation and all preproduction artifact pins
# remain inherited unchanged; only the vector-store transport changes.
_inherit: mbzuai_preprod_production.yaml

vector_store:
  provider: "pinecone"
  dimensions: 1536

embedder:
  pinecone_index: "mbzuai-gemini-retrieval-v4"
  pinecone_sparse_index: ""
  enable_sparse: false
  enable_sparse_evidence_spans: false
  use_sparse_embeddings: false
  create_index_if_missing: true
  verify_index_after_upload: true
  verify_index_min_count_only: false
  vector_reuse:
    enabled: true
    source_work_dir: "runs/mbzuai_main/mbzuai-preprod-readable-titles-pinecone-production-20260831-v3"
    source_upload_manifest_sha256: "3292ba2d4058d01f03c3b6b40fe26e75b7ab9bf57357f4338c32c14e4b124209"
    # Blue/green releases write to a new index, then promote only after exact
    # count and quality gates pass. The source manifest still pins the model,
    # dimensionality, namespaces, lane counts, and record fingerprints.
    allow_cross_index: true
    # Reuse byte-identical vectors from v3, while embedding the corrected or
    # newly generated records that cannot exist in the previous release.
    require_complete: false
    fetch_batch_size: 500

retrieval:
  # Production retrieval must generalize to unseen questions. These settings
  # disable the legacy evaluation-prompt-to-page rules and instead use Page
  # Cards, parent expansion, semantic sufficiency, and a cross-encoder reranker.
  query_specific_retrieval_rules_enabled: false
  semantic_evidence_sufficiency_enabled: true
  enable_rerank: true
  rerank_model: "pinecone-rerank-v0"
  rerank_skip_high_confidence_fact: true

# Lists replace their inherited value during config resolution. Keep this
# sequence identical to mbzuai_production except for the final store adapter.
stages:
  - id: verify_selected_profile
    type: formatter
    plugin: selected_profile_guard
  - id: assemble_selected_release
    type: formatter
    plugin: selected_release_assembly
  - id: format_assertion_slices
    type: formatter
    plugin: extraction_slices
  - id: extract_assertions_openai
    type: formatter
    plugin: openai_assertion_extract
  - id: validate_assertions_openai
    type: formatter
    plugin: openai_assertion_validate
  - id: canonicalize_assertions
    type: formatter
    plugin: assertion_canonicalize
  - id: promote_assertions
    type: formatter
    plugin: assertion_promote
  - id: format_retrieval
    type: formatter
    plugin: retrieval_bundle_v2
  - id: format_graph
    type: formatter
    plugin: knowledge_graph
  - id: promote_graph
    type: formatter
    plugin: semantic_graph_promote
  - id: community_graph
    type: formatter
    plugin: semantic_graph_community
  - id: summarize_community_graph
    type: formatter
    plugin: semantic_graph_summarize
  - id: upload_retrieval
    type: embedder
    plugin: gemini_pinecone
