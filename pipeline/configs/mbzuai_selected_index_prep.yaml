# Pre-embedding release checkpoint for the controlled multilingual A/B winner.
# This run is deliberately limited to profile verification, audited corpus
# import, lossless chunking, and a chunk-complete Page Graph bridge. It has no
# embedding, vector-store, upload, or production-promotion stage.

project_name: "mbzuai_selected_index_prep"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

selected_profile:
  variant_id: "c650__gemini2_1536__dense_graph"
  decision_file: "runs/evaluation/mbzuai-multilingual-controlled-ab-v1/results/final_selection.json"
  decision_sha256: "52826eda7fd57ff0d0042f9850d900cd0c932396fd68366c8cd550f38fc458b2"
  pre_embedding_only: true
  record_kinds:
    - "chunk"
    - "parent"
    - "parent_section"
    - "media"
    - "page_card"
    - "action"

chunker:
  strategy: "hybrid"
  use_docling_native: true
  include_section_headings: true
  always_emit_headings: false
  target_tokens: 650
  max_tokens: 900
  overlap_tokens: 100
  min_chunk_tokens: 160
  max_chunks_per_document: 0

# Frozen here even though this checkpoint never calls Gemini. A later embedding
# run must consume the generated artifacts with this same contract.
embedder:
  engine: "gemini"
  model: "gemini-embedding-2"
  output_dimensionality: 1536
  enable_sparse: false
  enable_sparse_evidence_spans: false
  use_sparse_embeddings: false
  query_format: "task: search result | query: {query}"
  document_format: "title: {title} | text: {text}"
  media_input: "caption_text"

# Frozen physical-store contract for the later embedding run. This preparation
# profile still has no upload stage and therefore does not connect to Postgres.
vector_store:
  provider: "pgvector"
  schema: "mbzuai_retrieval"
  records_table: "embedding_records"
  releases_table: "releases"
  dimensions: 1536
  schema_version: 2
  dsn_env: "PGVECTOR_DSN"
  ingest_dsn_env: "PGVECTOR_INGEST_DSN"
  reader_role: "mbzuai_retriever"
  writer_role: "mbzuai_indexer"
  require_ssl: true
  require_active_release: false

retrieval:
  index_mode: "dense_graph"
  enable_sparse: false
  navigation_plan_enabled: true
  navigation_plan_required: true

formatter:
  corpus_merge:
    use_current_artifacts: false
    require_source_audit_ok: true
    minimum_source_count: 1
    source_runs:
      - role: "prepared_corpus"
        run_dir: "runs/mbzuai_corpus_preparation/mbzuai-corpus-preparation-20260821-v4"
        project_name: "mbzuai_corpus_preparation"
        required_stage_ids:
          - "prepare_corpus_boundary"
        evidence:
          pipeline_state_sha256: "f13c64a15c2a0ef5ea3a31a530f089a385c969ba686179d4d9ec25ae0ca4a2b5"
          artifact_catalog_sha256: "1d5ffeacfc47a2079a1c4700b1da3e762e5938555d5022b5ce514150fffb37c5"
          run_audit_sha256: "a10fb89bba682972fa06c8ac678d3f4cc22658a76ec15b408fe78e86e6cce2ec"
          resolved_config_sha256: "34210b98f44ebbd9351fdb09ea4e03ce235a17524286ba9fdf220aef92809a95"

  page_graph_bridge:
    source_representation_run_dir: "runs/mbzuai_representation_v2/mbzuai-representation-v2-20260821-v2"
    source_corpus_run_dir: "runs/mbzuai_corpus_preparation/mbzuai-corpus-preparation-20260821-v4"
    require_chunk_index: true
    # The evaluated dense-graph representation groups chunks by exact Markdown
    # section path and PDF page range. Preserve those 6,322 parent-section
    # scopes while separately retaining raw Page Card HTML heading nodes.
    derive_document_sections: true

stages:
  - id: verify_selected_profile
    type: formatter
    plugin: selected_profile_guard
  - id: import_prepared_corpus
    type: formatter
    plugin: corpus_merge
  - id: chunk_content
    type: chunker
    plugin: hybrid
  - id: bridge_page_graph
    type: formatter
    plugin: page_graph_bridge
