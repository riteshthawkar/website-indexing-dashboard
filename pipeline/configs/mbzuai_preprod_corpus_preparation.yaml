# Representation-neutral handoff for the authorized MBZUAI preproduction
# snapshot. It merges the completed semantic-caption corpus with the immutable
# exact-OCR overlay, deduplicates only Markdown evidence, and performs no
# chunking, embedding, database writes, or release promotion.

project_name: "mbzuai_preprod_corpus_preparation"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

quality:
  dedup_threshold: 0.85
  dedup_num_perm: 128
  dedup_ngram_size: 5
  preserve_duplicate_source_media: true

formatter:
  corpus_merge:
    use_current_artifacts: false
    require_source_audit_ok: true
    minimum_source_count: 2
    # Ordering is intentional: the OCR overlay wins media-sidecar collisions,
    # while the captioned processing run supplies Markdown and local assets.
    source_runs:
      - role: "ocr_overlay"
        run_dir: "runs/mbzuai_preprod_hybrid_ocr/mbzuai-preprod-hybrid-ocr-20260831-v2"
        project_name: "mbzuai_preprod_hybrid_ocr"
        required_stage_ids:
          - "enrich_exact_ocr"
        evidence:
          pipeline_state_sha256: "3aea1e67ccc283c1c9e2795b2db2eb7748d92e8782f72bf1429a30f8d721013b"
          artifact_catalog_sha256: "4c1e573a686690c66e6922cd5c2dd8abc332ae8d12a69bc564334cdeb416f4a9"
          run_audit_sha256: "ff0dd45f08704eb5bcd18c551a163a412c33908ea83d7fa39db8d2bea09fc34f"
          resolved_config_sha256: "83e0d731bd66d9a62d6d111b581819a67bfb705071261bfc695c7ca5109cd314"
      - role: "captioned_corpus"
        run_dir: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v4"
        project_name: "mbzuai_preprod_processing"
        required_stage_ids:
          - "convert_documents"
          - "convert_html"
          - "enrich_media"
          - "annotate_media"
        evidence:
          pipeline_state_sha256: "b09565b61826fe84602a77364962708e18e61468b6f8c610e7678c997b0d1ac7"
          artifact_catalog_sha256: "b8d64431e398c9c4458577719e2ece13ceabbe3a08eaa750bb4eaaa3a62704ed"
          run_audit_sha256: "19952a61c40a454a63d16cb8c1ca040b8d33142a7410913ed0ebc609228237dc"
          resolved_config_sha256: "dd2232db7c0bab89092ad3759d6e4409a18bee96ced5a3111b59f4a989743412"

  corpus_preparation:
    # Do not permit the corrected snapshot to regress below the prior audited
    # corpus boundary; the new run records its larger exact inventory.
    minimum_document_count: 1682
    minimum_unique_media_assets: 2127
    maximum_missing_media_files: 0
    maximum_unbound_media_assets: 0
    minimum_semantically_annotated_visuals: 2127
    minimum_ocr_adjudicated_visuals: 331

stages:
  - id: merge_corpora
    type: formatter
    plugin: corpus_merge
  - id: deduplicate_markdown
    type: quality_gate
    plugin: dedup_filter
  - id: prepare_corpus_boundary
    type: formatter
    plugin: corpus_preparation
