# Representation-neutral handoff for the authorized MBZUAI preproduction
# snapshot. It merges the completed semantic-caption corpus with the immutable
# exact-OCR overlay, deduplicates only Markdown evidence, and performs no
# chunking, embedding, database writes, or release promotion.

project_name: "mbzuai_preprod_corpus_preparation"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

quality:
  dedup_threshold: 0.85
  dedup_num_perm: 128
  dedup_ngram_size: 5
  preserve_duplicate_source_media: true
  # Rendered SPA snapshots can expose the same substantive page under several
  # route aliases. Collapse byte-identical copies while retaining every URL as
  # Page Card/source lineage; short shared labels and boilerplate stay intact.
  collapse_exact_cross_route_web_duplicates: true
  cross_route_exact_duplicate_minimum_characters: 160
  cross_route_exact_duplicate_minimum_words: 20

formatter:
  corpus_merge:
    use_current_artifacts: false
    require_source_audit_ok: true
    minimum_source_count: 2
    # Ordering is intentional: the OCR overlay wins media-sidecar collisions,
    # while the captioned processing run supplies Markdown and local assets.
    source_runs:
      - role: "ocr_overlay"
        run_dir: "runs/mbzuai_preprod_hybrid_ocr/mbzuai-preprod-hybrid-ocr-disclosure-fix-20260903-v2"
        project_name: "mbzuai_preprod_hybrid_ocr"
        include_url_less_documents: true
        media_metadata_overlay: true
        required_stage_ids:
          - "enrich_exact_ocr"
        evidence:
          pipeline_state_sha256: "5ef2e312e7c18df5067baa6bdfff6d854f29bb5e1a795d9ef8804cc39a67dc48"
          artifact_catalog_sha256: "275811438f29aa5e89318758dcbd1416fd4e9dfb96da3327295e00c012cf3b9d"
          run_audit_sha256: "b3808277cbb6ad6939899d4b9a2baa995b1007c0a979c29d3863e75231a09e98"
          resolved_config_sha256: "bdc72f496a7ff3d9f0961f092641085120378e3d42ce89a4ce23beb2b4d42488"
      - role: "captioned_corpus"
        run_dir: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-disclosure-fix-20260903-v3"
        project_name: "mbzuai_preprod_processing"
        # PDF figures are intentionally URL-less and are instead bound to an
        # immutable source document. Admit them without weakening host filters
        # for ordinary webpage media.
        include_url_less_documents: true
        media_snapshot_authority: true
        required_stage_ids:
          - "convert_documents"
          - "convert_html"
          - "enrich_media"
          - "annotate_media"
        evidence:
          pipeline_state_sha256: "8a83f5f103920961898728bc7e71c1d33029db50f8177b346f053a5614ea159d"
          artifact_catalog_sha256: "72ad81d62ed4e66ab3f5ec3b0efb1add0e1af0f5d886c5fcbb285bef00c4440b"
          run_audit_sha256: "617a9edf25d820ca88a36a01571669be8a1a81eb2930437ae2d1829448f4da3c"
          resolved_config_sha256: "0d314665470f070521aecc889d746422b7ace5233ffc04749ef5c40111c19b6d"

  corpus_preparation:
    # Do not permit the corrected snapshot to regress below the prior audited
    # corpus boundary; the new run records its larger exact inventory.
    minimum_document_count: 1682
    minimum_unique_media_assets: 2129
    maximum_missing_media_files: 0
    maximum_unbound_media_assets: 0
    minimum_semantically_annotated_visuals: 2129
    # The disclosure-aware semantic classifier selected exactly 322 unique
    # visuals for OCR; the fresh content-hash-pinned batch adjudicated all 322.
    minimum_ocr_adjudicated_visuals: 322

stages:
  - id: merge_corpora
    type: formatter
    plugin: corpus_merge
  - id: deduplicate_markdown
    type: quality_gate
    plugin: dedup_filter
  - id: prepare_corpus_boundary
    type: formatter
    plugin: corpus_preparation
