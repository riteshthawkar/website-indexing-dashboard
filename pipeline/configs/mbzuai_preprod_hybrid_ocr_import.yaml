# Immutable exact-OCR overlay for the authorized 2026-08-30 MBZUAI
# preproduction crawl. The GPU batch is content-hash pinned and adjudicated
# locally before this stage is allowed to enrich the completed caption corpus.

project_name: "mbzuai_preprod_hybrid_ocr"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

formatter:
  media_ocr:
    provider: "batch_manifest"
    model: "PP-OCRv5 + baidu/Unlimited-OCR"
    model_revision: "paddleocr-3.7.0/paddle-3.2.0 + 07dea832e22aefee32ad281d4b80551282e1c168"
    provider_revision: "paddleocr-3.7.0 + transformers-direct"
    quality_revision: "hybrid-exact-ocr-quality-v1"
    batch_contract_sha256: "25ce21d2748af62c59e5951b4830168bd06f3027e7fb483cbd1b9613f4eb8e04"
    batch_results:
      path: "runs/mbzuai_preprod_hybrid_ocr/mbzuai-preprod-hybrid-ocr-20260831-v3/results/adjudicated.json"
      sha256: "a71af1c8f43fc884b53dd1424d8f259b5f6e30c087310648e94973889db32aa3"
    # A refreshed corpus may remove old visuals. Ignore adjudicated results
    # that are no longer selected, but continue to fail if any current
    # OCR-required content hash is missing from the pinned batch.
    allow_unused_batch_results: true
    input_artifacts:
      page_media_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v5/stage_outputs/annotate_media/semantically_annotated_page_media.json"
        sha256: "e4f51edb012c59d3e8f82af23795879c6db76ea8286caf5661ee2c7037b68602"
      page_images_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v5/stage_outputs/annotate_media/semantically_annotated_page_images.json"
        sha256: "6186abac7ff7147f4220b84b7a7c2d7cc78dac1336dbe383c291c4bdc4f2c739"
      extracted_images_index_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v5/stage_outputs/annotate_media/semantically_annotated_document_media.json"
        sha256: "f1de95d0e29faa5d04dfd973b020def19033c9daa7cfd3a28750be8c5de059b2"
      media_manifest_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v5/stage_outputs/annotate_media/semantically_annotated_media_manifest.json"
        sha256: "9416c143705e2e069e6ec15c737b98f71cbccb1cb3d55af5008b4f9d0e222c11"
    scope: "all"
    needs_ocr_only: true
    concurrency: 1
    retry_attempts: 1
    request_timeout_sec: 1
    primary_mode: "gundam"
    retry_mode: "base"
    max_images: 0
    minimum_usable_text_ratio: 0.55
    maximum_rejected_ratio: 0.25
    require_complete: true

stages:
  - id: enrich_exact_ocr
    type: formatter
    plugin: media_ocr
