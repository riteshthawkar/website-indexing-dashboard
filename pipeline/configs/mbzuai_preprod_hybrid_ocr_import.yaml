# Immutable exact-OCR overlay for the authorized 2026-08-30 MBZUAI
# preproduction crawl. The GPU batch is content-hash pinned and adjudicated
# locally before this stage is allowed to enrich the completed caption corpus.

project_name: "mbzuai_preprod_hybrid_ocr"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

formatter:
  media_ocr:
    provider: "batch_manifest"
    model: "PP-OCRv5 + baidu/Unlimited-OCR"
    model_revision: "paddleocr-3.7.0/paddle-3.2.0 + 07dea832e22aefee32ad281d4b80551282e1c168"
    provider_revision: "paddleocr-3.7.0 + transformers-direct"
    quality_revision: "hybrid-exact-ocr-quality-v1"
    batch_contract_sha256: "a82e0ead2f2c5b5adbbce314a53dfd9132169cec4d8d820d9fe316d44d856a5a"
    batch_results:
      path: "runs/mbzuai_preprod_hybrid_ocr/mbzuai-preprod-hybrid-ocr-20260831-v2/results/adjudicated.json"
      sha256: "e6ed8c61911c8d4ec0ee1a4245f9bda4699d5d72083e959fc0959e1c8af6ffc3"
    # A refreshed corpus may remove old visuals. Ignore adjudicated results
    # that are no longer selected, but continue to fail if any current
    # OCR-required content hash is missing from the pinned batch.
    allow_unused_batch_results: true
    input_artifacts:
      page_media_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v4/stage_outputs/annotate_media/semantically_annotated_page_media.json"
        sha256: "74d86c758510dd91ef17a78a12f6f5350b4fd6a6002f770ba6f293cbff86415b"
      page_images_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v4/stage_outputs/annotate_media/semantically_annotated_page_images.json"
        sha256: "d11036248177a2ce6020f005b465771b6f37041ae8d3c19f6f6c3936043b7396"
      extracted_images_index_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v4/stage_outputs/annotate_media/semantically_annotated_document_media.json"
        sha256: "c0167605a709ea2789daf9ab452492838a9639c774f63069352498a180cf0391"
      media_manifest_file:
        path: "runs/mbzuai_preprod_processing/mbzuai-preprod-processing-20260831-v4/stage_outputs/annotate_media/semantically_annotated_media_manifest.json"
        sha256: "d408a28bfc6fa03d30df79fb4e9b0354749da4b79a096c02b60a5c6dbb815774"
    scope: "all"
    needs_ocr_only: true
    concurrency: 1
    retry_attempts: 1
    request_timeout_sec: 1
    primary_mode: "gundam"
    retry_mode: "base"
    max_images: 0
    minimum_usable_text_ratio: 0.55
    maximum_rejected_ratio: 0.25
    require_complete: true

stages:
  - id: enrich_exact_ocr
    type: formatter
    plugin: media_ocr
