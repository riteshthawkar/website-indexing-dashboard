# Representation-neutral handoff for the September 2026 preproduction
# snapshot. Exact OCR wins media collisions, while the captioned run supplies
# Markdown, structured documents, page mappings, and validated local assets.

project_name: "mbzuai_preprod_refresh_corpus_preparation"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

quality:
  dedup_threshold: 0.85
  dedup_num_perm: 128
  dedup_ngram_size: 5
  preserve_duplicate_source_media: true

formatter:
  corpus_merge:
    use_current_artifacts: false
    require_source_audit_ok: true
    minimum_source_count: 2
    source_runs:
      - role: "exact_ocr_overlay"
        run_dir: "runs/mbzuai_preprod_refresh_hybrid_ocr/mbzuai-preprod-refresh-hybrid-ocr-20260909-v1"
        project_name: "mbzuai_preprod_refresh_hybrid_ocr"
        required_stage_ids:
          - "enrich_exact_ocr"
        evidence:
          pipeline_state_sha256: "243151425ad42240adf01c7e304250268843d75f0a00be141966e0a66d57434e"
          artifact_catalog_sha256: "cb557d554a9a1aca96a8c592e4ed65ff7681341be6f28e9f83b109aa8bdee61b"
          run_audit_sha256: "9d5956fec7c78e82b48bc9c4f0500ee3ea1d4cd05fb9289f43ff225a421c57d1"
          resolved_config_sha256: "4c80abdd58a84b9ede8880b74af04bbeb54b7158b66cd453aa9e62ec3a1e818e"
      - role: "captioned_preproduction_snapshot"
        run_dir: "runs/mbzuai_preprod_refresh_pdf_media_completion/mbzuai-preprod-refresh-pdf-media-20260909-v1"
        project_name: "mbzuai_preprod_refresh_pdf_media_completion"
        required_stage_ids:
          - "merge_captioned_corpus"
          - "complete_pdf_media"
          - "annotate_recovered_media"
        evidence:
          pipeline_state_sha256: "4dba665571ed88b049ad4fc83ef2132aef09ac457fee85e96bd325d61691332a"
          artifact_catalog_sha256: "918c130cb7873d5be6f798190a8cce52c968a715ef1a2a23016ac06494cf4253"
          run_audit_sha256: "994280bb071941baf73a645770e32ef00887fc74cd0e4911455a9eb0a56ac586"
          resolved_config_sha256: "92af81aa95a31128c55b2d73049847bc438ef80580cf65ccf9b7b75774e4e203"

  corpus_preparation:
    expand_canonical_url_aliases: true
    expand_html_artifact_aliases: true
    allow_media_only_pdf_assets: true
    minimum_document_count: 2500
    minimum_unique_media_assets: 1900
    maximum_missing_media_files: 0
    maximum_unbound_media_assets: 0
    minimum_semantically_annotated_visuals: 1900
    minimum_ocr_adjudicated_visuals: 240

stages:
  - id: merge_corpora
    type: formatter
    plugin: corpus_merge
  - id: deduplicate_markdown
    type: quality_gate
    plugin: dedup_filter
  - id: prepare_corpus_boundary
    type: formatter
    plugin: corpus_preparation
