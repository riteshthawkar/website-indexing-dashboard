_inherit: mbzuai_main_gemini_neo4j_graphrag.yaml

retrieval:
  retriever_backend: "routed_hybrid"
  routed_graph_enabled: true
  routed_graph_query_types: ["fact"]
  routed_graph_min_confidence: 0.38
  routed_fallback_to_vector: true
  parallel_graph_enabled: true
  parallel_query_rewriting_enabled: true
  parallel_graph_augment_all_queries: true
