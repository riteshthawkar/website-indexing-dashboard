_inherit: mbzuai_output_validation.yaml

project_name: "mbzuai_html_output_validation"

stages:
  - id: crawl_web
    type: crawler
    plugin: crawl4ai
  - id: score_raw_content
    type: quality_gate
    plugin: quality_scorer
  - id: clean_html
    type: cleaner
    plugin: trafilatura
  - id: convert_html
    type: converter
    plugin: markitdown
  - id: deduplicate_markdown
    type: quality_gate
    plugin: dedup_filter
