# Immutable raw-artifact crawl for the redesigned MBZUAI preproduction site.
#
# The preproduction frontend intentionally publishes no XML sitemap and sends
# an X-Robots-Tag noindex header.  The site owner has explicitly authorized a
# complete crawl that ignores robots directives; the downstream noindex
# override is recorded separately in the derived processing profile.
_inherit: default.yaml

project_name: "mbzuai_preprod_crawl"
work_dir: "./runs"

pipeline:
  production_profile: false
  require_production_preflight: false
  audit_on_stage_complete: true
  audit_on_run_complete: true
  fail_on_audit_error: true

stages:
  - id: crawl_web
    type: crawler
    plugin: crawl4ai

crawler:
  start_url: "https://preprod.mbzuai.ac.ae/"
  max_pages: 5000
  max_depth: 8
  fetch_concurrency: 1
  download_concurrency: 4
  sitemap_crawl_batch_size: 20
  timeout: 45
  # Run this profile under xvfb-run. A headed Linux Chromium session is needed
  # because the preprod WAF rejects API pagination from headless/non-browser clients.
  headless: false
  enable_stealth: true
  fail_on_empty_result: true
  fail_on_incomplete_frontier: true
  require_complete_seed_inventory: true
  require_complete_priority_seeds: true
  require_https: true
  ignore_https_errors: false

  # No sitemap exists on this Nuxt/Drupal preproduction frontend. Discovery
  # combines the public Drupal search inventory with rendered same-host links
  # and is bounded by both max_pages and this exact-host budget.
  sitemap_enabled: false
  minimum_sitemap_seed_count: 0
  sitemap_origins: []
  sitemap_entry_urls: []
  minimum_sitemap_urls_by_host: {}
  link_discovery_hosts:
    - "preprod.mbzuai.ac.ae"
  link_discovery_max_pages_by_host:
    "preprod.mbzuai.ac.ae": 5000
  minimum_crawled_pages_by_host:
    "preprod.mbzuai.ac.ae": 1

  # The navigation graph exposes only a subset of published content. These
  # bounded Drupal JSON inventories enumerate the global search corpus and
  # every client-paginated collection directly. Their API pages are evidence
  # only; each discovered content URL is still rendered and saved normally.
  seed_inventory_endpoints:
    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/search"
      browser_context_url: "https://preprod.mbzuai.ac.ae/search"
      page_param: "page"
      page_start: 0
      total_pages_key: "totalPages"
      item_element: "search-result"
      url_keys:
        - "url"
      max_pages: 250
      minimum_urls: 1400
      required: true
      require_all_pages: true

    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/academics/faculty-directory"
      browser_context_url: "https://preprod.mbzuai.ac.ae/academics/faculty-directory"
      page_param: "page"
      page_start: 0
      total_items_key: "totalItems"
      items_per_page_key: "itemsPerPage"
      item_element: "node-faculty-listing-card"
      url_keys:
        - "url"
      max_pages: 30
      minimum_urls: 220
      required: true
      require_all_pages: true

    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/ar/academics/faculty-directory"
      browser_context_url: "https://preprod.mbzuai.ac.ae/ar/academics/faculty-directory"
      page_param: "page"
      page_start: 0
      total_items_key: "totalItems"
      items_per_page_key: "itemsPerPage"
      item_element: "node-faculty-listing-card"
      url_keys:
        - "url"
      max_pages: 30
      minimum_urls: 210
      required: true
      require_all_pages: true

    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/news-events/news"
      browser_context_url: "https://preprod.mbzuai.ac.ae/news-events/news"
      page_param: "page"
      page_start: 0
      total_items_key: "totalItems"
      items_per_page_key: "itemsPerPage"
      item_element: "node-news-listing-card"
      url_keys:
        - "url"
      max_pages: 150
      minimum_urls: 900
      required: true
      require_all_pages: true

    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/news-events/events"
      browser_context_url: "https://preprod.mbzuai.ac.ae/news-events/events"
      page_param: "page"
      page_start: 0
      total_items_key: "totalItems"
      items_per_page_key: "itemsPerPage"
      item_element: "node-events-latest-articles"
      url_keys:
        - "url"
      max_pages: 10
      minimum_urls: 10
      required: true
      require_all_pages: true

    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/research/project-hub"
      browser_context_url: "https://preprod.mbzuai.ac.ae/research/project-hub"
      page_param: "page"
      page_start: 0
      total_items_key: "totalItems"
      items_per_page_key: "itemsPerPage"
      item_element: "node-research-project-search-result"
      url_keys:
        - "url"
      max_pages: 10
      minimum_urls: 10
      required: true
      require_all_pages: true

    # Startup cards have no detail URLs. Capture every API card and append its
    # semantic text to the saved listing page so all paginated cards are indexed.
    - url: "https://preprod.mbzuai.ac.ae/api/drupal-ce/innovation-partnerships/national-engagement-outreach/startup-showcase"
      browser_context_url: "https://preprod.mbzuai.ac.ae/innovation-partnerships/national-engagement-outreach/startup-showcase"
      page_param: "page"
      page_start: 0
      total_items_key: "totalItems"
      items_per_page_key: "itemsPerPage"
      item_element: "node-startup-listing-card"
      url_keys:
        - "url"
      capture_items: true
      item_text_keys:
        - "title"
        - "industryName"
        - "stageName"
        - "text"
        - "value"
        - "processed"
      augment_listing_url: "https://preprod.mbzuai.ac.ae/innovation-partnerships/national-engagement-outreach/startup-showcase"
      require_item_count_match: true
      minimum_items: 1
      max_pages: 10
      minimum_urls: 0
      required: true
      require_all_pages: true

  # Low request parallelism and bounded backoff avoid intermittent preprod WAF
  # challenges while still making the inventory deterministic and resumable.
  seed_inventory_transport: "browser"
  seed_inventory_fetch_concurrency: 1
  seed_inventory_request_delay_sec: 0.45
  seed_inventory_max_response_bytes: 2097152
  seed_inventory_fetch_attempts: 6
  seed_inventory_retry_backoff_sec: 2.0

  # Cloudflare permits a primed browser session to fetch same-origin content,
  # while challenging repeated top-level browser navigations. This transport
  # keeps one authenticated page open and captures each SSR HTML response.
  frontier_fetch_transport: "browser_fetch"
  browser_fetch_context_url: "https://preprod.mbzuai.ac.ae/"
  browser_fetch_max_response_bytes: 16777216
  browser_fetch_request_delay_sec: 0.6

  # The preproduction frontend intermittently responds with a transient 404
  # or 5xx while a deployment route is warming. Recheck these statuses with
  # bounded backoff before accepting a page as terminally unavailable.
  transient_page_statuses:
    - 404
    - 500
    - 502
    - 503
    - 504
  sitemap_failed_url_retry_attempts: 4
  sitemap_failed_retry_backoff_sec: 1.5
  raw_source_retry_attempts: 4
  raw_source_retry_backoff_sec: 1.25
  retry_recoverable_skipped_on_resume: true
  recoverable_skip_max_retries: 6
  # Direct HTTP is deliberately challenged on this host, so browser failures
  # are retried in the browser frontier instead of wasting time on raw fallback.
  attempt_http_fallback_for_browser_failures: false
  delay_before_return_html: 0.5
  mean_delay: 0.35
  max_range: 0.4
  simulate_user: false
  magic: false

  # SPA listings are covered by the required JSON inventories above. Avoid
  # depending on browser pagination because the frontend turns transient API
  # challenges into a misleading client-side 404 page.
  require_complete_dynamic_collections: false
  dynamic_collections: []

  allowed_domains:
    - "preprod.mbzuai.ac.ae"
  allowed_hosts:
    - "preprod.mbzuai.ac.ae"
  excluded_subdomains: []
  include_external: false
  allow_query_urls: false
  allowed_query_param_names: []
  excluded_path_prefixes:
    - "/_nuxt/"
    - "/api/"
    - "/ce-api"
    - "/nuxt-component-preview"
    - "/content/media/"

  # Explicit owner authorization recorded 2026-08-30: crawl every content page
  # regardless of robots.txt and nofollow declarations on this preprod host.
  respect_robots_txt: false
  robots_user_agent: "MBZUAIKnowledgeIndexer"
  robots_unknown_host_policy: "allow"
  robots_origins: []
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36"
  headers:
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    Accept-Language: "en-US,en;q=0.9,ar;q=0.8"
  # Cloudflare Access now protects the refreshed preproduction application.
  # Only environment-variable names are persisted in the immutable run; the
  # service-token values are resolved in memory and never logged or snapshotted.
  request_header_env:
    - name: "CF-Access-Client-Id"
      env: "CLOUDFLARE_ACCESS_CLIENT_ID"
      required: true
    - name: "CF-Access-Client-Secret"
      env: "CLOUDFLARE_ACCESS_CLIENT_SECRET"
      required: true

  # These routes anchor every major information architecture branch even if a
  # client-rendered menu or listing fails to expose one during a crawl.
  priority_seed_urls:
    - "https://preprod.mbzuai.ac.ae/"
    - "https://preprod.mbzuai.ac.ae/ar"
    - "https://preprod.mbzuai.ac.ae/about-us"
    - "https://preprod.mbzuai.ac.ae/about-us/leadership/office-the-president"
    - "https://preprod.mbzuai.ac.ae/about-us/leadership"
    - "https://preprod.mbzuai.ac.ae/about-us/contact-us"
    - "https://preprod.mbzuai.ac.ae/research"
    - "https://preprod.mbzuai.ac.ae/research/our-divisions"
    - "https://preprod.mbzuai.ac.ae/research/project-hub"
    - "https://preprod.mbzuai.ac.ae/study/undergraduate-program"
    - "https://preprod.mbzuai.ac.ae/study/msc-programs"
    - "https://preprod.mbzuai.ac.ae/study/phd-programs"
    - "https://preprod.mbzuai.ac.ae/academics/faculty-directory"
    - "https://preprod.mbzuai.ac.ae/ar/academics/faculty-directory"
    - "https://preprod.mbzuai.ac.ae/admissions"
    - "https://preprod.mbzuai.ac.ae/admissions-aid/undergraduate-admissions"
    - "https://preprod.mbzuai.ac.ae/graduate-masters-admissions"
    - "https://preprod.mbzuai.ac.ae/admissions-aid/graduate-phd-admissions"
    - "https://preprod.mbzuai.ac.ae/innovation-partnerships"
    - "https://preprod.mbzuai.ac.ae/campus-community"
    - "https://preprod.mbzuai.ac.ae/news-events"
    - "https://preprod.mbzuai.ac.ae/news-events/news"
    - "https://preprod.mbzuai.ac.ae/news-events/events"
    - "https://preprod.mbzuai.ac.ae/innovation-partnerships/national-engagement-outreach/startup-showcase"

  # The headed browser capture is authoritative for this protected SPA. Raw
  # validation requests are blocked by the WAF and add no independent signal.
  validate_source_html: false
  validate_source_html_mode: "never"
  parse_source_html_for_media: false
  extract_images: true
  download_page_images: false
  max_images_per_page: 30
  extract_videos: true
  max_videos_per_page: 10
  fetch_video_transcripts: true
  max_video_transcript_kb: 128
