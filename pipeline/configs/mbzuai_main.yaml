# ─────────────────────────────────────────────────────────────
# MBZUAI Main Website — full pipeline config
# ─────────────────────────────────────────────────────────────
_inherit: default.yaml

project_name: "mbzuai_main"

crawler:
  start_url: "https://mbzuai.ac.ae"
  max_pages: 5000
  fetch_concurrency: 4
  download_concurrency: 8
  sitemap_crawl_batch_size: 30
  validate_source_html_mode: "always"
  recoverable_skip_max_retries: 2
  # Request starts are globally paced below; a small in-flight pool hides
  # origin latency without increasing the per-hop request rate.
  cohort_probe_concurrency: 4
  cohort_probe_attempts: 3
  cohort_probe_backoff_sec: 2.0
  cohort_probe_min_interval_sec: 1.5
  cohort_probe_max_bytes: 4096
  # Researched public-origin inventory (2026-08-20). Production uses an exact
  # host list so certificate/DNS discoveries cannot pull admin, auth, tracking,
  # or research-service hosts into the crawler by suffix alone.
  origin_inventory_revision: "2026-08-20-v1"
  allowed_domains:
    - "mbzuai.ac.ae"
    - "ifm.ai"
  allowed_hosts:
    - "mbzuai.ac.ae"
    - "www.mbzuai.ac.ae"
    - "careers.mbzuai.ac.ae"
    - "research.mbzuai.ac.ae"
    - "ai-nexus.mbzuai.ac.ae"
    - "library.mbzuai.ac.ae"
    - "metaverse.mbzuai.ac.ae"
    - "buildit.mbzuai.ac.ae"
    - "hpp.mbzuai.ac.ae"
    - "ifm.mbzuai.ac.ae"
    - "ifm.ai"
  excluded_subdomains:
    - "academy.mbzuai.ac.ae"
    - "irep.mbzuai.ac.ae"
    - "dclibrary.mbzuai.ac.ae"
    - "xing.mbzuai.ac.ae"
  user_agent: "Mozilla/5.0 (compatible; MBZUAIKnowledgeIndexer/1.0; +https://mbzuai.ac.ae)"
  robots_user_agent: "MBZUAIKnowledgeIndexer"
  robots_unknown_host_policy: "deny"
  robots_origins:
    - "https://mbzuai.ac.ae"
    - "https://www.mbzuai.ac.ae"
    - "https://careers.mbzuai.ac.ae"
    - "https://research.mbzuai.ac.ae"
    - "https://ai-nexus.mbzuai.ac.ae"
    - "https://library.mbzuai.ac.ae"
    - "https://metaverse.mbzuai.ac.ae"
    - "https://buildit.mbzuai.ac.ae"
    - "https://hpp.mbzuai.ac.ae"
    - "https://ifm.mbzuai.ac.ae"
    - "https://ifm.ai"
  sitemap_origins:
    - "https://mbzuai.ac.ae"
    - "https://careers.mbzuai.ac.ae"
    - "https://research.mbzuai.ac.ae"
    - "https://ai-nexus.mbzuai.ac.ae"
    - "https://hpp.mbzuai.ac.ae"
    - "https://ifm.ai"
  sitemap_entry_urls:
    - "https://mbzuai.ac.ae/sitemap.xml"
    - "https://careers.mbzuai.ac.ae/wp-sitemap.xml"
    - "https://research.mbzuai.ac.ae/sitemap.xml"
    - "https://ai-nexus.mbzuai.ac.ae/sitemap_index.xml"
    - "https://hpp.mbzuai.ac.ae/sitemap_index.xml"
    - "https://ifm.ai/sitemap_index.xml"
  minimum_sitemap_urls_by_host:
    "mbzuai.ac.ae": 2100
    "careers.mbzuai.ac.ae": 40
    "research.mbzuai.ac.ae": 8
    "ai-nexus.mbzuai.ac.ae": 8
    "hpp.mbzuai.ac.ae": 3
    "ifm.ai": 15
  # These origins do not currently publish usable XML sitemaps. Their roots
  # are deterministic seeds and link expansion is allowed only within the same
  # exact host and bounded by the per-host budgets below.
  link_discovery_hosts:
    - "library.mbzuai.ac.ae"
    - "metaverse.mbzuai.ac.ae"
    - "buildit.mbzuai.ac.ae"
  link_discovery_max_pages_by_host:
    "library.mbzuai.ac.ae": 300
    "metaverse.mbzuai.ac.ae": 100
    "buildit.mbzuai.ac.ae": 100
  minimum_crawled_pages_by_host:
    "mbzuai.ac.ae": 2100
    "careers.mbzuai.ac.ae": 40
    "research.mbzuai.ac.ae": 8
    "ai-nexus.mbzuai.ac.ae": 8
    "hpp.mbzuai.ac.ae": 3
    "ifm.ai": 15
    "library.mbzuai.ac.ae": 1
    "metaverse.mbzuai.ac.ae": 1
    "buildit.mbzuai.ac.ae": 1
  priority_seed_urls:
    - "https://mbzuai.ac.ae/about/office-of-the-president"
    - "https://mbzuai.ac.ae/about/leadership"
    - "https://mbzuai.ac.ae/about/contact"
    - "https://mbzuai.ac.ae/study/graduate-admission-process"
    - "https://mbzuai.ac.ae/study/ug-admission-process"
    - "https://mbzuai.ac.ae/student-resources/campus-facilities"
    - "https://library.mbzuai.ac.ae/"
    - "https://metaverse.mbzuai.ac.ae/"
    - "https://buildit.mbzuai.ac.ae/"
  origin_inventory:
    canonical_aliases:
      "ifm.mbzuai.ac.ae": "ifm.ai"
    deferred_specialized_crawls:
      "irep.mbzuai.ac.ae": "Public DSpace repository; robots.txt requires Crawl-delay: 10 and a separate rate-limited ingester."
    policy_exclusions:
      "academy.mbzuai.ac.ae": "robots.txt disallows all crawling."
      "dclibrary.mbzuai.ac.ae": "TLS certificate does not match the hostname."
      "xing.mbzuai.ac.ae": "robots.txt returns HTTP 403, so crawl permission cannot be established."
      "apply.mbzuai.ac.ae": "Applicant workflow rather than public institutional content."
      "engage.mbzuai.ac.ae": "Authenticated login workflow."
      "staticcdn.mbzuai.ac.ae": "Static asset delivery, not a page corpus."
  excluded_path_prefixes:
    - "/tag/"
    - "/ar/tag/"
    # This transient, noindex outage notice is stale and must never become
    # retrievable chatbot evidence. Keep the exclusion route-specific so the
    # substantive student-resource child pages remain available.
    - "/moodle-service-interruption"
    - "/ar/moodle-service-interruption"
    # These two Arabic faculty aliases redirect to each other indefinitely.
    # Keep the healthy English faculty profile eligible for indexing.
    - "/ar/study/faculty/qirong-ho-ar"
    - "/ar/study/faculty/qirong-ho"
  # Yoast still advertises non-content sitemap members. Every fresh run probes
  # each configured, source-bound cohort member and excludes only exact URLs
  # proven to return an empty HTTP 200 body. Mixed cohorts are safe: members
  # with content remain eligible and are crawled automatically.
  known_empty_sitemap_cohorts:
    - id: "legacy-publications-v1"
      source_url: "https://mbzuai.ac.ae/publication-sitemap.xml"
      allowed_path_prefixes: ["/publication", "/ar/publication"]
      expected_member_count: 33
      max_members: 50
    - id: "empty-category-archives-v1"
      source_url: "https://mbzuai.ac.ae/category-sitemap.xml"
      allowed_path_prefixes: ["/category", "/ar/category"]
      expected_member_count: 55
      max_members: 75
    - id: "empty-news-hub-v1"
      source_url: "https://mbzuai.ac.ae/news-sitemap.xml"
      exact_urls: ["https://mbzuai.ac.ae/ar/news"]
      expected_member_count: 1
      max_members: 1
    - id: "empty-training-hubs-v1"
      source_url: "https://mbzuai.ac.ae/training_program-sitemap.xml"
      exact_urls:
        - "https://mbzuai.ac.ae/training-programs"
        - "https://mbzuai.ac.ae/ar/training-programs"
      expected_member_count: 2
      max_members: 2
    - id: "empty-llm-vacancy-hub-v1"
      source_url: "https://mbzuai.ac.ae/llmvacancy-sitemap.xml"
      exact_urls: ["https://mbzuai.ac.ae/llmvacancy"]
      expected_member_count: 1
      max_members: 1
    - id: "empty-course-type-archives-v1"
      source_url: "https://mbzuai.ac.ae/course_type-sitemap.xml"
      allowed_path_prefixes: ["/course_type"]
      expected_member_count: 2
      max_members: 2
    - id: "empty-department-archives-v1"
      source_url: "https://mbzuai.ac.ae/department-sitemap.xml"
      allowed_path_prefixes: ["/department", "/ar/department"]
      expected_member_count: 26
      max_members: 40
    - id: "empty-job-category-archives-v1"
      source_url: "https://mbzuai.ac.ae/job_category-sitemap.xml"
      allowed_path_prefixes: ["/job_category"]
      expected_member_count: 1
      max_members: 1
    - id: "empty-theme-archives-v1"
      source_url: "https://mbzuai.ac.ae/theme-sitemap.xml"
      allowed_path_prefixes: ["/Theme", "/ar/Theme"]
      expected_member_count: 13
      max_members: 20
    - id: "empty-talk-category-archives-v1"
      source_url: "https://mbzuai.ac.ae/talk_category-sitemap.xml"
      allowed_path_prefixes: ["/talk_category", "/ar/talk_category"]
      expected_member_count: 60
      max_members: 75
    - id: "empty-speaker-archives-v1"
      source_url: "https://mbzuai.ac.ae/speaker-sitemap.xml"
      allowed_path_prefixes: ["/speaker", "/ar/speaker"]
      expected_member_count: 263
      max_members: 300
    - id: "empty-podcast-category-archives-v1"
      source_url: "https://mbzuai.ac.ae/podcast_category-sitemap.xml"
      allowed_path_prefixes: ["/podcast_category"]
      expected_member_count: 1
      max_members: 1
    - id: "empty-research-center-category-archives-v1"
      source_url: "https://mbzuai.ac.ae/research_center_cat-sitemap.xml"
      allowed_path_prefixes: ["/research-center"]
      expected_member_count: 1
      max_members: 1
embedder:
  # Candidate runs must never clear or mutate the active release namespaces.
  # The upload manifest records the resolved names and the retriever consumes
  # that manifest after promotion.
  namespace_strategy: "release"
  namespace_release_template: "{base}--{release_id}"
  model: "gemini-embedding-2"
  output_dimensionality: 1536
  pinecone_index: "mbzuai-gemini-retrieval-v3"
  pinecone_sparse_index: "mbzuai-gemini-retrieval-v3-sparse"
  namespace: ""
  namespace_chunks: "mbzuai_main-chunks"
  namespace_parents: "mbzuai_main-parents"
  namespace_media: "mbzuai_main-media"
  namespace_facts: "mbzuai_main-facts"
  namespace_evidence_spans: "mbzuai_main-evidence-spans"
  namespace_summaries: "mbzuai_main-summaries"
  namespace_assertions: "mbzuai_main-assertions"
  namespace_entities: "mbzuai_main-entities"
  namespace_communities: "mbzuai_main-communities"
  enable_dense_evidence_spans: true
  enable_sparse_evidence_spans: true
