name: lawa-rag package

on:
  pull_request:
    paths:
      - "lawa_rag/**"
      - "pipeline/**"
      - "ci/smoke_lawa_rag_package.py"
      - "ci/retriever_smoke_fixture.py"
      - "ci/smoke_retriever_runtime.py"
      - "ci/validate_package_wheel.py"
      - "ci/qualify_lawa_rag_pdf.py"
      - "requirements.txt"
      - "requirements-retriever.txt"
      - "requirements-test.txt"
      - "pyproject.toml"
      - ".github/workflows/lawa-rag-package.yml"
  push:
    branches: [main]
    paths:
      - "lawa_rag/**"
      - "pipeline/**"
      - "ci/smoke_lawa_rag_package.py"
      - "ci/retriever_smoke_fixture.py"
      - "ci/smoke_retriever_runtime.py"
      - "ci/validate_package_wheel.py"
      - "ci/qualify_lawa_rag_pdf.py"
      - "requirements.txt"
      - "requirements-retriever.txt"
      - "requirements-test.txt"
      - "pyproject.toml"
      - ".github/workflows/lawa-rag-package.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package contract dependencies
        run: |
          python -m pip install pip==26.1.2 setuptools==82.0.1 wheel==0.47.0
          python -m pip install ".[retrieval,graphs,ingestion,object-storage,test]"
          python -m pip check
      - name: Test fast public package contracts
        run: >-
          python -m pytest -q -m "not production_contract"
          pipeline/tests/test_lawa_rag_*.py
      - name: Test production package contracts
        run: >-
          python -m pytest -q -m production_contract
          pipeline/tests/test_lawa_rag_*.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Validate wheel contents
        run: python ci/validate_package_wheel.py dist/lawa_rag-*.whl
      - name: Smoke-test installed wheel
        run: |
          install_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$install_dir" dist/lawa_rag-*.whl
          (cd "$install_dir" && PYTHONPATH="$install_dir" python \
            "$GITHUB_WORKSPACE/ci/smoke_lawa_rag_package.py" \
            --expected-package-root "$install_dir")

  document-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install document adapter dependencies with CPU-only Torch
        run: |
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[documents,ingestion,test]"
          python -m pip check
      - name: Exercise real offline Docling adapters
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python -m pytest -q pipeline/tests/test_lawa_rag_documents.py
