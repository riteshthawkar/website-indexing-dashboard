name: lawa-rag package

on:
  pull_request:
    paths:
      - "lawa_rag/**"
      - "pipeline/**"
      - "ci/validate_package_wheel.py"
      - "pyproject.toml"
      - ".github/workflows/lawa-rag-package.yml"
  push:
    branches: [main]
    paths:
      - "lawa_rag/**"
      - "pipeline/**"
      - "ci/validate_package_wheel.py"
      - "pyproject.toml"
      - ".github/workflows/lawa-rag-package.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package contract dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Test public package contracts
        run: python -m pytest -q pipeline/tests/test_lawa_rag_package.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Validate wheel contents
        run: python ci/validate_package_wheel.py dist/lawa_rag-*.whl
      - name: Smoke-test installed wheel
        run: |
          install_dir="$(mktemp -d)"
          python -m pip install --no-deps --target "$install_dir" dist/lawa_rag-*.whl
          (cd "$install_dir" && python -c "import lawa_rag; assert lawa_rag.available_pipeline_configs()")
