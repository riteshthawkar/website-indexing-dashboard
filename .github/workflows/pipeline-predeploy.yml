name: Indexing Pipeline Pre-Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: test-openai-key
      GEMINI_API_KEY: test-gemini-key
      PINECONE_API_KEY: test-pinecone-key
      PIPELINE_IMAGE: mbzuai-indexing-pipeline:${{ github.sha }}
      RETRIEVER_IMAGE: mbzuai-retriever:${{ github.sha }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-retriever.txt
            requirements-test.txt
            pipeline/requirements-docling.txt

      - name: Install dependencies
        run: |
          python -m pip install pip==26.1.2 setuptools==82.0.1 wheel==0.47.0
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip check

      - name: Audit production dependencies
        run: |
          python -m pip_audit --requirement requirements.txt --strict --progress-spinner off
          python -m pip_audit --requirement requirements-retriever.txt --strict --progress-spinner off

      - name: Validate retriever-only dependency closure
        run: |
          python -m venv "${RUNNER_TEMP}/retriever-venv"
          "${RUNNER_TEMP}/retriever-venv/bin/python" -m pip install pip==26.1.2 setuptools==82.0.1 wheel==0.47.0
          "${RUNNER_TEMP}/retriever-venv/bin/python" -m pip install --requirement requirements-retriever.txt
          "${RUNNER_TEMP}/retriever-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/retriever-venv/bin/python" -m pipeline.service.retrieval_runner --help >/dev/null
          "${RUNNER_TEMP}/retriever-venv/bin/python" ci/smoke_retriever_runtime.py

      - name: Run production contract and test suite
        run: bash ci/run_predeploy_checks.sh

      - name: Build production image
        run: |
          touch \
            .env.predeploy-canary \
            predeploy-credentials-canary.json \
            predeploy-certificate-canary.pem \
            predeploy-runtime-canary.sqlite3
          trap 'rm -f .env.predeploy-canary predeploy-credentials-canary.json predeploy-certificate-canary.pem predeploy-runtime-canary.sqlite3' EXIT
          docker build \
            --build-arg RELEASE_COMMIT_SHA="${{ github.sha }}" \
            --tag "${PIPELINE_IMAGE}" \
            .
          docker run --rm --entrypoint sh "${PIPELINE_IMAGE}" -ec '
            test ! -e /app/.env.predeploy-canary
            test ! -e /app/predeploy-credentials-canary.json
            test ! -e /app/predeploy-certificate-canary.pem
            test ! -e /app/predeploy-runtime-canary.sqlite3
          '
          actual_revision="$(docker image inspect "${PIPELINE_IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "${actual_revision}" = "${{ github.sha }}" || {
            echo "Pipeline image revision mismatch: ${actual_revision}" >&2
            exit 1
          }

      - name: Build and smoke retriever-only image
        run: |
          docker build \
            --build-arg RELEASE_COMMIT_SHA="${{ github.sha }}" \
            --file Dockerfile.retriever \
            --tag "${RETRIEVER_IMAGE}" \
            .
          actual_revision="$(docker image inspect "${RETRIEVER_IMAGE}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "${actual_revision}" = "${{ github.sha }}" || {
            echo "Retriever image revision mismatch: ${actual_revision}" >&2
            exit 1
          }
          docker run --rm --entrypoint python "${RETRIEVER_IMAGE}" \
            -m pipeline.service.retrieval_runner --help >/dev/null
          docker run --rm --entrypoint python \
            --volume "${PWD}/ci/smoke_retriever_runtime.py:/tmp/smoke_retriever_runtime.py:ro" \
            "${RETRIEVER_IMAGE}" /tmp/smoke_retriever_runtime.py

          set +e
          startup_output="$(docker run --rm "${RETRIEVER_IMAGE}" 2>&1)"
          startup_status=$?
          set -e
          printf '%s\n' "${startup_output}"
          if [[ ${startup_status} -eq 0 ]]; then
            echo "Retriever image unexpectedly started without durable release storage." >&2
            exit 1
          fi
          grep -F "release storage marker is missing" <<<"${startup_output}"

      - name: Generate pipeline image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.PIPELINE_IMAGE }}
          format: spdx-json
          artifact-name: pipeline-image-${{ github.sha }}.spdx.json
          upload-release-assets: false

      - name: Scan pipeline image for fixable high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.PIPELINE_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true

      - name: Generate retriever image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.RETRIEVER_IMAGE }}
          format: spdx-json
          artifact-name: retriever-image-${{ github.sha }}.spdx.json
          upload-release-assets: false

      - name: Scan retriever image for fixable high-severity vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.RETRIEVER_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          cache-db: true
