[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawa-rag"
version = "0.1.0"
description = "Reusable indexing, retrieval, evaluation, and release contracts for LawaAI RAG systems."
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
graphs = ["ijson==3.5.0"]
ingestion = ["tiktoken==0.9.0"]
object-storage = ["boto3==1.43.46"]
documents = [
  "docling==2.94.0",
  "docling-core==2.75.0",
  "openpyxl==3.1.5",
]
documents-ocr = ["docling[easyocr]==2.94.0"]
retrieval = [
  "beautifulsoup4==4.13.3",
  "boto3==1.43.46",
  "fastapi==0.136.1",
  "google-genai==1.75.0",
  "openai==2.28.0",
  "pgvector==0.5.0",
  "pinecone==9.0.0",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic==2.13.4",
  "rank-bm25==0.2.2",
  "requests==2.33.0",
  "uvicorn[standard]==0.47.0",
]
indexing = [
  "aiohttp==3.14.1",
  "beautifulsoup4==4.13.3",
  "boto3==1.43.46",
  "certifi==2026.4.22",
  "chardet==5.2.0",
  "crawl4ai==0.9.1",
  "datasketch==1.9.0",
  "docling==2.94.0",
  "fastapi==0.136.1",
  "google-genai==1.75.0",
  "httpx==0.28.1",
  "igraph==1.0.0",
  "jsonschema==4.26.0",
  "langdetect==1.0.9",
  "leidenalg==0.11.0",
  "lxml==6.1.1",
  "lxml-html-clean==0.4.5",
  "markitdown==0.1.1",
  "networkx==3.6.1",
  "numpy==1.26.4",
  "openai==2.28.0",
  "opencv-python==4.11.0.86",
  "openpyxl==3.1.5",
  "orjson==3.11.6",
  "pdfplumber==0.11.9",
  "pgvector==0.5.0",
  "pillow==12.2.0",
  "pinecone==9.0.0",
  "pinecone-text==0.10.0",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic==2.13.4",
  "PyMuPDF==1.25.4",
  "python-docx==1.2.0",
  "python-dotenv==1.2.2",
  "python-pptx==1.0.2",
  "rank-bm25==0.2.2",
  "requests==2.33.0",
  "tiktoken==0.9.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "trafilatura==2.0.0",
  "transformers==5.4.0",
  "uvicorn[standard]==0.47.0",
  "websockets==16.0",
]
test = [
  "ijson==3.5.0",
  "pytest==9.0.3",
  "tomli==2.2.1; python_version < '3.11'",
]

[project.scripts]
lawa-rag-auto-eval = "lawa_rag.auto_eval.cli:main"
lawa-rag-ingest = "lawa_rag.ingestion.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lawa_rag*", "pipeline*"]
exclude = ["pipeline.tests*"]

[tool.setuptools.package-data]
lawa_rag = ["py.typed"]
pipeline = ["configs/*.yaml", "configs/*.yml"]

[tool.pytest.ini_options]
markers = [
  "production_contract: exercises production configuration or runtime boundaries without external network calls",
]
